# M.2 拓扑（Q1-B）:
#   Mode B 运行: M.2 SSD PCIe x2 直通 Type-C 注入 HOST, 不经 B1
#     (M.2→PI3DBS16412→Type-C 4 差分对→K1→OCuLink→HOST)
#   Mode A: B1 经 PCIEC x2 连 M.2（UAS 桥接）, MUX 切换（B1 PCIEC ↔ Type-C 通道）
# PCIE 引脚组（ball 号 = b1_pin_map.json 568-ball 实证, ECO #31 T3）:
#   PCIEA x1: REFCLK AG1/AG2（数据对 USB3_SSTX/SSRX = AH1/AH2, AF1/AF2 复用）
#   PCIEB x2: REFCLK T21/T22, TX0 N21/N22, TX1 M21/M22, RX0 R21/R22, RX1 P21/P22
#   PCIEC x2: REFCLK L21/L22, TX0 H21/H22, TX1 G21/G22, RX0 K21/K22, RX1 J21/J22
#   PERST# = PCIE0_PERSTN @ B5（GPIO54 复用）
# UCPD 引脚重分配决策（LEAD OI#7: UCPD 内建; 本决策由 K1 侧 ioconvert_v2.yaml 应用, T8 范围, 本文件仅落档）:
#   实测核对（ST DS12288 Table 12 + Figure 12, 2026-08-20）:
#     PA9 = UCPD1_DBCC1, PA10 = UCPD1_DBCC2（死电池 Rd 控制, 非 UCPD1_DP/DM）
#     UCPD1_CC1 = PA8（标准 KBU6 已引出）; UCPD1_CC2 = PB15 —— 标准 STM32G0B1KBU6 未引出（仅 N 版 KBU6N pin17）
#   冲突: 原决策"释放 PA9/PA10 给 UCPD1_DM/DP"前提不成立（PA9/PA10 无 DM/DP 复用）
#   落档决策: UART 从 PA9/PA10 移 J9 OOB 接口后需 LEAD 复核下述路径:
#     a) 换 STM32G0B1KBU6N（CC1=PA8 + CC2=PB15, VDDIO2）— 保 OI#7 内建
#     b) 单 CC（仅 CC1）— 仅固定朝向/单向线缆可用
#     c) 外置 CC/PD PHY — 违 OI#7 内建, 降级备用
#   ⚠ 需 LEAD 复核裁定; 执行属 T8（ioconvert_v2.yaml）, 本文件禁止改 ioconvert
